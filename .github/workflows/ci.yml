name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Complete course, Portal and persistence verification
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Compare the actual PR base and reviewed implementation payload.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check # Includes required documentation/local-link validation
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-desktop-ci.mjs # Runs the fixed guarded profile; records candidate evidence only after exit0
      - run: npm run quality:release -- --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
